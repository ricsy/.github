name: 任务记录
description: 记录一个明确范围的待办任务
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 请说明这项任务的来源和上下文。
      placeholder: 请说明任务从哪里来、为什么现在要做。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 请列出本次要做的边界，不要把多个不相关主题混在一起。
      placeholder: 请说明本次只处理哪些内容，不处理哪些内容。
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: 交付结果
      description: 请说明本次完成后应该产出什么。
      placeholder: 请说明完成后的文件、行为或结果。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 验证方式
      description: 请说明怎么验证这项任务完成。
      placeholder: 请说明如何确认这项任务已经完成。
    validations:
      required: true
